name: Build and publish Docker image

# Se dispara solo al subir un tag de versión (v1.2.3). Un push normal a main
# no construye nada: la imagen se corresponde con un release, no con cada commit.
on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # El tag de git "v1.2.3" -> imagen "1.2.3", más "latest" en cada
          # tag que llegue (no solo en el más nuevo del historial de main).
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # steps.meta.outputs.version is the bare semver ("1.2.3") the tag
          # step above derived from the pushed "v1.2.3" — the version the
          # backend reports in /api/status and in its log banner (see
          # Dockerfile). Without this the image falls back to pyproject's
          # number, which in this fork still tracks upstream.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
