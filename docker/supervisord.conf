; The whole supervisor configuration, not a fragment dropped into the
; distribution's one.
;
; The Debian package's /etc/supervisor/supervisord.conf wants to write its
; socket, its pid file and its logs in places only root may write, and this
; container runs as an unprivileged user on purpose (see the Dockerfile).  So
; the file is self-contained and every path it names belongs to that user.

[supervisord]
nodaemon=true
user=aimm
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

; A screen for a browser that must not look headless.
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN_GEOMETRY)s -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; That screen, over VNC, so a person can solve a CAPTCHA or finish a login.
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -nopw -forever -shared -rfbport %(ENV_VNC_PORT)s
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The monitor itself.
;
; `stopsignal=TERM` and a generous `stopwaitsecs` are the container end of a
; clean shutdown: the monitor now treats SIGTERM as Ctrl-C, which flushes the
; browser profile (the thing that keeps you signed in), sends whatever
; notification was still queued, and closes every Chromium.  Killing it instead
; loses all three.
[program:aimm]
command=/opt/venv/bin/aimm --webui --webui-host %(ENV_AIMM_WEBUI_HOST)s --webui-port %(ENV_AIMM_WEBUI_PORT)s
environment=DISPLAY=":99"
autorestart=true
priority=40
stopsignal=TERM
stopwaitsecs=45
; Straight to the container's own output, so `docker logs` and `docker compose
; logs` show what the monitor is doing.  Log files inside a container are a
; place for output to go and be forgotten.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
