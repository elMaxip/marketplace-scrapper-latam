#
# Settings shipped with the package, merged in before the user's own file.
#
# Regions used to live here: a dozen [region.*] blocks naming cities in the
# United States, Canada, Australia and a handful of other countries.  They were
# removed on purpose.  A built-in region is only useful to somebody who happens
# to live in one of the countries whoever wrote it thought of -- there was never
# one for Chile, for instance -- and every one of them appeared in the web UI's
# region picker whether or not it had anything to do with where the user
# searches.  Regions are now something the user saves for themselves, in their
# own config file, from the places they actually search; see the "Regiones
# guardadas" panel in the web UI.
#
# What is left here is translation, which is genuinely shared: these are the
# words the scrapers look for on the page, not a choice about where to search.
#

